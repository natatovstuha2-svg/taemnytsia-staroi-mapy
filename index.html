<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таємниця старої мапи</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fff; }

  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .viewer {
    width: 100%;
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr auto;
    place-items: center;
    gap: 10px;
    padding: 22px 14px 14px;
  }

  .stage {
    width: 100%;
    height: calc(100svh - 88px);
    min-height: 420px;
    display: grid;
    place-items: center;
    perspective: 1800px;
  }

  #scaleBox {
    position: relative;
    transform-origin: center center;
  }

  #physicalBook {
    position: relative;
    transform-style: preserve-3d;
    filter: drop-shadow(0 18px 22px rgba(0,0,0,.18));
  }

  /* Тонка "обкладинка" під усім книжковим блоком. */
  #physicalBook::before {
    content: "";
    position: absolute;
    z-index: -3;
    left: 5px;
    right: -9px;
    top: 5px;
    bottom: -9px;
    border-radius: 4px 7px 8px 5px;
    background: #174f7c;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.16),
      8px 10px 20px rgba(0,0,0,.12);
  }

  /* Дуже тонкий паперовий блок, без товстих "смуг". */
  #physicalBook::after {
    content: "";
    position: absolute;
    z-index: -2;
    left: 3px;
    right: -5px;
    top: 3px;
    bottom: -5px;
    border-radius: 3px 5px 6px 4px;
    background: #f6f6f2;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  }

  #bookCrop {
    position: relative;
    width: 800px;
    height: 600px;
    overflow: hidden;
    background: transparent;
    transition: width .22s ease;
  }

  #bookHost {
    width: 800px;
    height: 600px;
    transform: translateX(0);
    transition: transform .22s ease;
  }

  /* Закрита обкладинка: показуємо тільки праву половину,
     без величезнього порожнього аркуша ліворуч. */
  #physicalBook.cover #bookCrop { width: 400px; }
  #physicalBook.cover #bookHost { transform: translateX(-400px); }

  /* Фінал: показуємо тільки останню ліву сторінку. */
  #physicalBook.final #bookCrop { width: 400px; }
  #physicalBook.final #bookHost { transform: translateX(0); }

  /* Відкритий розворот: легкий центральний згин. */
  #physicalBook.open #bookCrop::after {
    content: "";
    position: absolute;
    z-index: 40;
    pointer-events: none;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 16px;
    transform: translateX(-50%);
    background: linear-gradient(
      90deg,
      rgba(0,0,0,.08),
      rgba(255,255,255,.10) 45%,
      rgba(0,0,0,.06)
    );
    opacity: .55;
  }

  .page {
    background: #fff;
    overflow: hidden;
  }

  .page img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #fff;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 46px;
  }

  .nav {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.12);
    background: #fff;
    color: #333;
    font-size: 27px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 5px 14px rgba(0,0,0,.08);
  }

  .nav:disabled {
    opacity: .24;
    cursor: default;
  }

  #counter {
    min-width: 70px;
    text-align: center;
    color: #777;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  #loading {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: #fff;
    color: #777;
    font-size: 14px;
  }

  #loading.hidden { display: none; }

  @media (max-width: 700px) {
    .viewer { padding: 10px 6px 8px; }
    .stage { height: calc(100svh - 72px); min-height: 360px; }
  }
</style>
</head>

<body>
<main class="viewer">
  <section class="stage" aria-label="Інтерактивна книга">
    <div id="loading">Завантаження книги…</div>

    <div id="scaleBox">
      <div id="physicalBook" class="cover">
        <div id="bookCrop">
          <div id="bookHost"></div>
        </div>
      </div>
    </div>
  </section>

  <nav class="controls" aria-label="Навігація">
    <button id="prev" class="nav" type="button" aria-label="Назад">‹</button>
    <span id="counter">1 / 14</span>
    <button id="next" class="nav" type="button" aria-label="Далі">›</button>
  </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(() => {
  "use strict";

  /* ТОЧНИЙ порядок ваших 14 готових файлів — без перестановок. */
  const PAGES = [
    "./00-cover.webp",
    "./01-text.png",
    "./02-illustration.webp",
    "./03-text.png",
    "./04-illustration.webp",
    "./05-illustration.webp",
    "./06-text.png",
    "./07-illustration.webp",
    "./08-illustration.webp",
    "./09-text.png",
    "./10-illustration.webp",
    "./11-text.png",
    "./12-illustration.webp",
    "./13-finale.webp"
  ];

  const host = document.getElementById("bookHost");
  const physical = document.getElementById("physicalBook");
  const scaleBox = document.getElementById("scaleBox");
  const loading = document.getElementById("loading");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const counter = document.getElementById("counter");

  let flip = null;
  let currentIndex = 0;

  function preload(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = resolve;
      img.onerror = () => reject(new Error("Не знайдено файл: " + src));
      img.src = src;
    });
  }

  function buildPages() {
    PAGES.forEach((src, i) => {
      const page = document.createElement("div");
      page.className = "page";
      page.dataset.density =
        (i === 0 || i === PAGES.length - 1) ? "hard" : "soft";

      const img = document.createElement("img");
      img.src = src;
      img.alt = i === 0 ? "Обкладинка" : "Сторінка " + (i + 1);
      img.draggable = false;

      page.appendChild(img);
      host.appendChild(page);
    });
  }

  function setBookState(index) {
    currentIndex = index;

    physical.classList.remove("cover", "open", "final");

    if (index === 0) {
      physical.classList.add("cover");
    } else if (index >= PAGES.length - 1) {
      physical.classList.add("final");
    } else {
      physical.classList.add("open");
    }

    counter.textContent = `${index + 1} / ${PAGES.length}`;
    prev.disabled = index <= 0;
    next.disabled = index >= PAGES.length - 1;

    requestAnimationFrame(fitBook);
  }

  function fitBook() {
    const stage = document.querySelector(".stage");
    const rect = stage.getBoundingClientRect();

    const logicalWidth =
      physical.classList.contains("open") ? 800 : 400;
    const logicalHeight = 600;

    const availableWidth = Math.max(280, rect.width - 44);
    const availableHeight = Math.max(320, rect.height - 34);

    const scale = Math.min(
      1,
      availableWidth / logicalWidth,
      availableHeight / logicalHeight
    );

    scaleBox.style.width = logicalWidth + "px";
    scaleBox.style.height = logicalHeight + "px";
    scaleBox.style.transform = `scale(${scale})`;
  }

  async function init() {
    try {
      if (!window.St || !window.St.PageFlip) {
        throw new Error("Не завантажилась механіка перегортання.");
      }

      await Promise.all(PAGES.map(preload));
      buildPages();

      flip = new St.PageFlip(host, {
        width: 400,
        height: 600,
        size: "fixed",
        drawShadow: true,
        flippingTime: 1150,
        usePortrait: false,
        startPage: 0,
        autoSize: false,
        maxShadowOpacity: 0.34,
        showCover: true,
        mobileScrollSupport: false,
        swipeDistance: 24,
        clickEventForward: true,
        useMouseEvents: true,
        disableFlipByClick: false
      });

      flip.on("init", e => setBookState(Number(e.data.page) || 0));
      flip.on("flip", e => setBookState(Number(e.data) || 0));

      flip.loadFromHTML(document.querySelectorAll(".page"));

      prev.addEventListener("click", () => {
        if (currentIndex > 0) flip.flipPrev("bottom");
      });

      next.addEventListener("click", () => {
        if (currentIndex < PAGES.length - 1) flip.flipNext("bottom");
      });

      document.addEventListener("keydown", e => {
        if (e.key === "ArrowRight" && currentIndex < PAGES.length - 1) {
          flip.flipNext("bottom");
        }
        if (e.key === "ArrowLeft" && currentIndex > 0) {
          flip.flipPrev("bottom");
        }
      });

      window.addEventListener("resize", fitBook);

      loading.classList.add("hidden");
      setBookState(0);

    } catch (err) {
      console.error(err);
      loading.textContent = err.message || "Не вдалося відкрити книгу.";
    }
  }

  init();
})();
</script>
</body>
</html>
