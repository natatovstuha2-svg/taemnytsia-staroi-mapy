<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Таємниця старої мапи</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="stage" aria-label="Інтерактивна книга «Таємниця старої мапи»">
    <div class="book-shell">
      <div id="book" class="book" aria-label="Книга з перегортанням сторінок"></div>
    </div>

    <nav class="controls" aria-label="Навігація сторінками">
      <button id="prev" class="nav-btn" type="button" aria-label="Попередня сторінка">‹</button>
      <span id="counter" class="counter" aria-live="polite">1 / 14</span>
      <button id="next" class="nav-btn" type="button" aria-label="Наступна сторінка">›</button>
    </nav>
  </main>
</body>
</html>
