<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Таємниця старої мапи</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .book-area {
      width: min(94vw, 860px);
      height: min(80svh, 650px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    #book {
      margin: auto;
      filter: drop-shadow(0 16px 18px rgba(0,0,0,.18));
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 6px;
      min-height: 48px;
    }

    button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #d9d9d9;
      background: #fff;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    button:disabled {
      opacity: .25;
      cursor: default;
    }

    #counter {
      min-width: 60px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      .book-area {
        width: 98vw;
        height: 78svh;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="book-area">
    <div id="book"></div>
  </div>

  <div class="controls">
    <button id="prev" type="button" aria-label="Попередня сторінка">‹</button>
    <span id="counter">1 / 14</span>
    <button id="next" type="button" aria-label="Наступна сторінка">›</button>
  </div>

  <!-- Справжня бібліотека м'якого перегортання сторінок -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script>
    const pages = [
      './00-cover.webp',
      './01-text.png',
      './02-illustration.webp',
      './03-text.png',
      './04-illustration.webp',
      './05-illustration.webp',
      './06-text.png',
      './07-illustration.webp',
      './08-illustration.webp',
      './09-text.png',
      './10-illustration.webp',
      './11-text.png',
      './12-illustration.webp',
      './13-finale.webp'
    ];

    const bookElement = document.getElementById('book');
    const prevButton = document.getElementById('prev');
    const nextButton = document.getElementById('next');
    const counter = document.getElementById('counter');

    const pageFlip = new St.PageFlip(bookElement, {
      width: 400,
      height: 600,

      size: 'stretch',
      minWidth: 260,
      maxWidth: 400,
      minHeight: 390,
      maxHeight: 600,

      showCover: true,
      usePortrait: true,
      autoSize: true,

      drawShadow: true,
      maxShadowOpacity: 0.35,
      flippingTime: 1100,

      startPage: 0,
      mobileScrollSupport: false,
      swipeDistance: 20,
      clickEventForward: true,
      disableFlipByClick: false
    });

    pageFlip.loadFromImages(pages);

    function updateControls() {
      const index = pageFlip.getCurrentPageIndex();
      counter.textContent = `${index + 1} / ${pages.length}`;
      prevButton.disabled = index <= 0;
      nextButton.disabled = index >= pages.length - 1;
    }

    pageFlip.on('init', updateControls);
    pageFlip.on('flip', updateControls);
    pageFlip.on('changeOrientation', updateControls);

    prevButton.addEventListener('click', () => pageFlip.flipPrev('bottom'));
    nextButton.addEventListener('click', () => pageFlip.flipNext('bottom'));

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') pageFlip.flipNext('bottom');
      if (event.key === 'ArrowLeft') pageFlip.flipPrev('bottom');
    });

    updateControls();
  </script>

</body>
</html>
